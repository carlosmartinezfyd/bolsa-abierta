name: CARM access diagnosis
on:
  push:
    branches: [fix/carm-live-access]
    paths: ['.github/workflows/carm-access-probe.yml', 'bolsa_abierta/browser_source.py']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest tests.test_browser_source tests.test_sources tests.test_parser
      - run: xvfb-run -a env RUN_BROWSER_TESTS=1 python -m unittest tests.test_browser_runtime
      - name: Check bounded source transport on hosted runner
        env:
          OFFICIAL_SOURCE_TRANSPORT: chromium
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          import json, hashlib
          from datetime import datetime, timezone
          from bolsa_abierta.sources import OfficialClient, SourceError
          from bolsa_abierta.parser import parse_pdf
          client=OfficialClient(max_seconds=45,retries=0)
          targets=[('index','https://www.carm.es/web/pagina?IDCONTENIDO=24219&IDTIPO=100','html'),
            ('latest','https://www.carm.es/web/descarga?ARCHIVO=ADJVACANTESSEC_SINCUBRIR-894862.pdf&ALIAS=ARCH&IDCONTENIDO=209571&IDTIPO=60&RASTRO=c77%24m22725%2C22759%2C4254','pdf')]
          for label,url,kind in targets:
              try:
                  result=client.fetch(url,kind=kind)
                  report={'label':label,'status':result.status,'bytes':len(result.body),'sha256':hashlib.sha256(result.body).hexdigest()}
                  if kind=='pdf':
                      doc=parse_pdf(result.body,url,datetime.now(timezone.utc).isoformat())
                      report.update(rows=doc['row_count'],places=doc['places'],published_at=doc['published_at'])
                  print(json.dumps(report),flush=True)
              except SourceError as error:
                  print(json.dumps({'label':label,'error_code':error.code}),flush=True)
                  raise SystemExit(1)
          PY
          xvfb-run -a python /tmp/probe.py
      - name: Validate every reviewed position original
        env:
          OFFICIAL_SOURCE_TRANSPORT: chromium
        run: xvfb-run -a python -m bolsa_abierta.position_sync --validate-only --validation-report .runtime/positions-validation.json
      - name: Exercise complete vacancy collection
        env:
          OFFICIAL_SOURCE_TRANSPORT: chromium
        run: xvfb-run -a python -m bolsa_abierta --data-dir .runtime/vacancies refresh
