name: CARM access diagnosis
on:
  push:
    branches: [fix/carm-live-access]
    paths: ['.github/workflows/carm-access-probe.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Check standard Chromium from hosted runner
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          import json, hashlib
          from playwright.sync_api import sync_playwright
          target='https://www.carm.es/web/descarga?ARCHIVO=ADJVACANTESSEC_SINCUBRIR-894862.pdf&ALIAS=ARCH&IDCONTENIDO=209571&IDTIPO=60&RASTRO=c77$m22725,22759,4254'
          with sync_playwright() as p:
              for headless in (True,False):
                  browser=p.chromium.launch(headless=headless,channel='chromium')
                  page=browser.new_page()
                  try:
                      response=page.goto('https://www.carm.es/web/pagina?IDCONTENIDO=24219&IDTIPO=100',timeout=25000)
                      print(json.dumps({'headless':headless,'index_status':response.status,'index_title':page.title()}),flush=True)
                      result=page.evaluate('''async url => {const r=await fetch(url,{signal:AbortSignal.timeout(25000)}); const b=new Uint8Array(await r.arrayBuffer()); return {status:r.status,type:r.headers.get('content-type'),size:b.length,pdf:new TextDecoder().decode(b.slice(0,5))==='%PDF-',sha256:Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('')};}''',target)
                      print(json.dumps(result),flush=True)
                  except Exception as error:
                      print(json.dumps({'headless':headless,'error':type(error).__name__}),flush=True)
                  finally:
                      browser.close()
          PY
          xvfb-run -a python /tmp/probe.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/browser-probe betterwright@1.5.0
      - run: /tmp/browser-probe/node_modules/.bin/betterwright setup --cloak-only
      - name: Check managed browser with a fresh profile
        run: |
          /tmp/browser-probe/node_modules/.bin/betterwright run --approve-downloads -c "await page.goto('https://www.carm.es/web/pagina?IDCONTENIDO=24219&IDTIPO=100'); return await page.evaluate(async () => {const r=await fetch('https://www.carm.es/web/descarga?ARCHIVO=ADJVACANTESSEC_SINCUBRIR-894862.pdf&ALIAS=ARCH&IDCONTENIDO=209571&IDTIPO=60');const b=new Uint8Array(await r.arrayBuffer());return {status:r.status,type:r.headers.get('content-type'),size:b.length,pdf:new TextDecoder().decode(b.slice(0,5))==='%PDF-',sha256:Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('')};});" --note 'Check official public PDF; metadata only'
