name: Validate code and extraction
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  test:
    # Pin the runner: Playwright 1.58.0 cannot install Chromium on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test real browser stream and redirect isolation
        env:
          RUN_BROWSER_TESTS: '1'
        run: xvfb-run -a python -m unittest tests.test_browser_runtime
      - run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Validate workflow syntax and shell usage
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: '-color'
