name: Deploy existing Cloudflare gateway
on:
  push:
    branches: [main]
    paths: ['gateway/**', '.github/workflows/deploy-gateway.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-source-publication
  cancel-in-progress: false
jobs:
  gateway:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select optional CI code deployment
        id: config
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          ready=bool(os.environ.get('CLOUDFLARE_API_TOKEN')) and bool(re.fullmatch(r'[a-fA-F0-9]{32}',os.environ.get('CLOUDFLARE_ACCOUNT_ID',''))) and bool(re.fullmatch(r'[a-fA-F0-9-]{36}',os.environ.get('D1_DATABASE_ID','')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('ready='+str(ready).lower()+'\n')
          if ready:
              Path('gateway/wrangler.toml').write_text(Path('gateway/wrangler.example.toml').read_text().replace('REPLACE_WITH_D1_DATABASE_ID',os.environ['D1_DATABASE_ID']))
          else:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Automatic code deployment is not configured. Code can be deployed with an authenticated local Wrangler session. Scheduled data publication uses POSITION_INGEST_TOKEN and does not require a Cloudflare deployment token.\n')
          PY
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Validate gateway
        if: steps.config.outputs.ready == 'true'
        run: node --test tests/gateway.test.mjs tests/positions-api.test.mjs tests/position-blocks.test.mjs
      - name: Install official Wrangler CLI
        if: steps.config.outputs.ready == 'true'
        run: npm install --no-save --package-lock=false wrangler@4
      - name: Prepare additive compact storage without historical index rebuilds
        if: steps.config.outputs.ready == 'true'
        run: python scripts/prepare_compact_gateway.py
      - name: Deploy verified code to the existing Worker
        if: steps.config.outputs.ready == 'true'
        run: npx wrangler deploy --config gateway/wrangler.toml
