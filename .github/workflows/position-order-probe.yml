name: Verify positions before broad discovery
on:
  push:
    branches: [fix/position-source-sequence]
    paths: ['.github/workflows/position-order-probe.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - name: Restore inventory metadata
        run: |
          mkdir -p .runtime
          git fetch origin data-state
          git show FETCH_HEAD:source-inventory.json > .runtime/source-inventory.json
          git show FETCH_HEAD:source-documents.json > .runtime/source-documents.json
      - name: Verify all current originals and resolve prior discoveries
        env:
          OFFICIAL_SOURCE_TRANSPORT: chromium
          CARM_MIN_REQUEST_INTERVAL: '2'
        run: xvfb-run -a python -m bolsa_abierta.position_sync --state .runtime/source-documents.json --inventory-state .runtime/source-inventory.json --inventory-dir .runtime/inventory --fetch-missing-inventory --validate-only
