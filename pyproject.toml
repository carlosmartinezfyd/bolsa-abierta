[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bolsa-abierta"
version = "0.2.0"
description = "Fuentes oficiales verificables para vacantes docentes de Murcia"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["requests==2.34.2", "beautifulsoup4==4.14.2", "pdfplumber==0.11.10", "cryptography>=46.0.0", "tzdata>=2025.2"]

[project.optional-dependencies]
test = []
server = ["gunicorn==23.0.0"]

[tool.setuptools]
packages = ["bolsa_abierta"]
