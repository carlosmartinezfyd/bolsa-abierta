name = "bolsa-abierta-gateway"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://carlosmartinezfyd.github.io"
SNAPSHOT_URL = "https://carlosmartinezfyd.github.io/bolsa-abierta/data/state.json"
GITHUB_REPOSITORY = "carlosmartinezfyd/bolsa-abierta"
GITHUB_REF = "main"
# Optional bounded cron: opt in only after observing the official HEAD validators.
CRON_ENABLED = "false"
OFFICIAL_FEED_URL = "https://www.carm.es/web/pagina?IDCONTENIDO=REPLACE_WITH_REVIEWED_FEED_ID&IDTIPO=100"
POSITION_DAILY_WRITE_LIMIT = "70000"
POSITION_ROW_WRITE_ESTIMATE = "32"
# GITHUB_TOKEN is a Worker secret, NEVER a vars value or frontend setting.

[[d1_databases]]
binding = "DB"
database_name = "bolsa-abierta-gateway"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# At most one additional cron; enable CRON_ENABLED only after configuring the feed.
# [triggers]
# crons = ["17,47 * * * *"]
